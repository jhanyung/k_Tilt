name: discover-feeds

on:
  schedule:
    - cron: "20 18 * * 0" # Monday 03:20 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m pipeline.discover --keep-existing | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the refreshed feed list if it changed
        run: |
          if git diff --quiet -- pipeline/data/feeds.lock.json; then
            echo "feed list unchanged"
            exit 0
          fi
          # Only commit when outlets were gained or lost, not for timestamp-only changes.
          if [ "$(git diff -U0 -- pipeline/data/feeds.lock.json | grep -c '^[+-] ')" -le 2 ]; then
            echo "only the timestamp changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/feeds.lock.json
          git commit -m "Refresh outlet feed list"
          git pull --rebase origin main
          git push
