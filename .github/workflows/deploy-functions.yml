name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "pipeline/outlets.yaml"
      - "pipeline/data/statements.yaml"
      - "pipeline/relay.py"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Skip until the Supabase access token exists
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_URL missing; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.ready == 'true'
        run: pip install -e .
      - if: steps.gate.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy relay
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pipeline.relay allowlist
          REF=$(python -m pipeline.relay ref)
          KEY=$(python -m pipeline.relay key)
          echo "::add-mask::$KEY"
          supabase secrets set "RELAY_KEY=$KEY" --project-ref "$REF"
          supabase functions deploy relay --project-ref "$REF" --no-verify-jwt
      - name: Smoke test from Seoul
        if: steps.gate.outputs.ready == 'true'
        run: |
          REF=$(python -m pipeline.relay ref)
          KEY=$(python -m pipeline.relay key)
          echo "::add-mask::$KEY"
          sleep 5
          for u in https://ichannela.com/robots.txt https://www.kwangju.co.kr/robots.txt https://www.yna.co.kr/robots.txt; do
            echo "--- $u"
            curl -sS -D - -o body.txt --max-time 40 \
              -H "x-relay-key: $KEY" -H "x-region: ap-northeast-2" \
              "https://$REF.supabase.co/functions/v1/relay?url=$u" \
              | grep -iE "^HTTP/|x-sb-edge-region|x-upstream-status|x-relay-error" || true
            grep -q "upstream error" body.txt && head -c 400 body.txt && echo || true
          done
          echo "--- open-proxy check (must be 403):"
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 \
            -H "x-relay-key: $KEY" \
            "https://$REF.supabase.co/functions/v1/relay?url=https://example.com/"
          echo "--- missing key (must be 403):"
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 \
            "https://$REF.supabase.co/functions/v1/relay?url=https://ichannela.com/robots.txt"
