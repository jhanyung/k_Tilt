name: assembly-members

# Weekly refresh of the National Assembly member list used to place quoted lawmakers.
on:
  schedule:
    - cron: "40 18 * * 0" # Monday 03:40 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: members

jobs:
  members:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - name: Skip until the Assembly API key exists
        id: gate
        run: |
          if [ -z "$ASSEMBLY_API_KEY" ]; then
            echo "::notice::ASSEMBLY_API_KEY is not set yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.ready == 'true'
        run: pip install -e .
      - if: steps.gate.outputs.ready == 'true'
        run: python -m pipeline.members
      - name: Commit the member list if it changed
        if: steps.gate.outputs.ready == 'true'
        run: |
          if git diff --quiet -- pipeline/data/assembly_members.json && \
             git ls-files --error-unmatch pipeline/data/assembly_members.json >/dev/null 2>&1; then
            echo "member list unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/assembly_members.json
          git commit -m "Refresh National Assembly member list"
          git pull --rebase origin main
          git push
