name: migrate

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "pipeline/migrate.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require the database secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add SUPABASE_DB_URL in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m pipeline.migrate
