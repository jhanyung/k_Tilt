name: analyse

# Re-run quote extraction for an edition by hand (the edition workflow runs it after
# every edition). Article text is fetched, analysed in memory and discarded.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition id (empty = latest)"
        type: string
        default: ""
      force:
        description: "Re-analyse articles done before"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and report only, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[analyse]"
      - run: >-
          python -m pipeline.analyse
          ${{ inputs.edition && format('--edition {0}', inputs.edition) || '' }}
          ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
