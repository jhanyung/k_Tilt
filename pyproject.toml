[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giulgi-pipeline"
version = "0.1.0"
description = "Automatic Korean news-comparison pipeline for 기울기"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6", "pytest>=8", "numpy>=1.26", "scikit-learn>=1.4", "kiwipiepy>=0.18",
  "trafilatura>=2.0", "lxml>=5.0",
]
# Ranking: sentence embeddings (ONNX, no PyTorch) and the Kiwi Korean analyser.
rank = ["numpy>=1.26", "scikit-learn>=1.4", "fastembed>=0.4", "kiwipiepy>=0.18"]
# Quotes: article text extraction (in memory only) and the Kiwi Korean analyser.
analyse = ["trafilatura>=2.0", "lxml>=5.0", "kiwipiepy>=0.18"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["data/*.yaml", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
