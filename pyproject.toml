[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giulgi-pipeline"
version = "0.1.0"
description = "Automatic Korean news-comparison pipeline for 기울기"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
